[program:{{.TaskExt.ClusterName}}]

# user
directory = {{.TaskPath}}
command = {{.TaskPath}}/bin/bitalostored --conf.file={{.TaskPath}}/config/config.toml
environment = LD_LIBRARY_PATH="{{.TaskRoot}}/lib/lib-stored",APP_NAME="{{.TaskExt.ClusterName}}",GOGC=300,GIN_MODE="release",MALLOC_CONF="background_thread:true,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000"

stopsignal = TERM
# 跟随supvisord启动
autostart = true
# 自动重启
autorestart = true
# 启动延时执行1秒
startsecs = 1
# 启动尝试次数
startretries = 5
redirect_stderr = true
#日志输出
stderr_logfile = {{.TaskPath}}/bitalos-server.dump
stdout_logfile = {{.TaskPath}}/bitalos-server.dump
[supervisord]
logfile = {{.TaskPath}}/supervisord-server.log
pidfile = {{.TaskPath}}/supervisord-server.pid