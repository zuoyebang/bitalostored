[log]
is_debug = false
rotation_time = "Daily"

[server]
product_name = "bitalostored-demo-node-2"
address = ":6372"
max_client = 15000
keep_alive = "600s"
max_procs = 4
net_event_loop_num = 8
db_path = "testdb/node2"
slow_time = "100ms"
slow_key_window_time = "2000ms"
slow_shield = false
slow_ttl  = "1s"
slow_maxexec = 100
slow_topn = 100
open_distributed_tx = false

[plugin]
open_raft = true
open_panic = true
open_pprof = false
pprof_addr = ":26770"

[bitalos]
write_buffer_size = "1gb"
enable_wal = false
bithash_gc_threshold = 0.5
compression_type = 1
io_write_qps_threshold = 20000
max_field_size = 60000
max_value_size = 6291456
enable_clock_cache = false
bitpage_flush_size = "96mb"
bitpage_split_size = "256mb"
bitpage_disable_minivi = false
vector_table_count = 1
vector_table_hash_size = 1048576
vector_table_gc_threshold = 0.35
disable_store_key = false
mem_table_size = "1gb"
vm_table_size = "1gb"
bitpage_task_worker_num = 4

[raft_queue]
workers = 32          
length = 10000           

[raft_cluster]
cluster_id = 1
election_rtt = 35
preelection_rtt = 15
heartbeat_rtt = 1
check_quorm = true
snapshot_entries = 6000000
compaction_overhead = 500000
max_in_mem_logsize = 0
snapshot_compression_type = 1
entry_compression_type = 1
disable_auto_compactions = false
timeout = "2s"
retry_times = 1
async_propose = true

[raft_nodehost]
host_name = "localhost"
node_id = 2
raft_address = "127.0.0.1:19082"
init_raft_addrlist = ["127.0.0.1:19081", "127.0.0.1:19082", "127.0.0.1:19083"]
init_raft_nodelist = [1, 2, 3]
join = false
snapshot_timeout = "10s"
rtt = 200
deployment_id = 0
max_snapshot_send_bytes_persecod = "200mb"
max_snapshot_recv_bytes_persecod = "200mb"

[raft_state]
interval = "3s"
allow_max_offset = 100000

[dynamic_deadline]
client_ratio_threshold = [0,20,50,80,90]
deadline_threshold = ["1800s","600s","180s","60s","10s"]